name: Build Frente APK

on:
  push:
    branches:
      - frente-apk-build-20260823

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore source
        run: |
          mkdir -p /tmp/frente-src
          base64 -d frente-apk-source.b64 > /tmp/frente.zip
          unzip -q /tmp/frente.zip -d /tmp/frente-src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: /tmp/frente-src/FrenteAPK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frente-debug-apk
          path: /tmp/frente-src/FrenteAPK/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish APK to branch
        run: |
          base64 -w0 /tmp/frente-src/FrenteAPK/app/build/outputs/apk/debug/app-debug.apk > frente-apk-output.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frente-apk-output.b64
          git commit -m "Publish compiled Frente APK"
          git push origin HEAD:frente-apk-build-20260823
