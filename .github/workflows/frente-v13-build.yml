name: Build Frente v1.3 APK

on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble Frente v1.3 source
        run: |
          cat frente-v2-java/part* > frente-build/app/src/main/java/com/nacho/frente/MainActivity.java
          python3 frente-ui-v12.py
          python3 frente-v13.py
          sed -i "s/versionCode 1/versionCode 4/; s/versionName '1.0'/versionName '1.3'/" frente-build/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build APK
        working-directory: frente-build
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Frente-v1.3-apk
          path: frente-build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
